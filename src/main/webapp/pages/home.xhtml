<!DOCTYPE html>
<!--suppress ALL -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="../WEB-INF/template/Layout.xhtml">

<ui:define name="titulo">TCS Treinamento JSF</ui:define>

<ui:define name="conteudo">
    <f:metadata>
        <f:viewAction action="#{gestaoAlunoBean.prepararTodosAlunos}" />

    </f:metadata>


    <!-- FORM TOP -->
    <h:form id="formTop">

        <!-- Message -->
        <p:messages id="messagesForm" />

        <!-- Toolbar -->
        <p:toolbar id="toolbar">
            <f:facet name="left">

                <!-- Botao Novo - Toolbar -->
                <p:commandButton value="Novo"
                                 icon="fa fa-plus"
                                 actionListener="#{gestaoAlunoBean.prepararNovoAluno}"
                                 oncomplete="PF('novoAlunoDialogWidgetVar').show();"
                                 update="novoAlunoDialog"
                                 process="@this"
                                 disabled="#{not empty gestaoAlunoBean.aluno}">
                    <p:resetInput target="novoAlunoDialog" />
                </p:commandButton>

                <!-- Botao Editar - Toolbar -->
                <p:commandButton value="Editar"
                                 icon="fa fa-pencil-square-o"
                                 disabled="#{empty gestaoAlunoBean.aluno}"
                                 oncomplete="PF('novoAlunoDialogWidgetVar').show(); return false;"
                                 update=""
                                 process="@this">
                    <p:resetInput target="novoAlunoDialog" />
                </p:commandButton>

                <!-- Botao Deletar - Toolbar -->
                <p:commandButton value="Deletar"
                                 icon="fa fa-trash"
                                 disabled="#{empty gestaoAlunoBean.aluno}"
                                 actionListener="#{gestaoAlunoBean.deletarAluno}"
                                 update="formTop:alunosDataTable"
                                 process="@this">
                    <p:resetInput target="novoAlunoDialog" />
                </p:commandButton>

                <!-- Botao Exportar Excel - Toolbar -->
                <p:commandButton value="Exportar para Excel"
                                 icon="fa fa-file-excel-o"
                                 update=""
                                 process="@this"
                                 ajax="false">
                    <p:dataExporter target="formTop:alunosDataTable" type="xls" fileName="TabelaAlunos"/>
                </p:commandButton>

            </f:facet>
        </p:toolbar>

        <!-- Dialog Novo Aluno -->
        <p:dialog id="novoAlunoDialog"
                  header="Novo Aluno"
                  widgetVar="novoAlunoDialogWidgetVar"
                  modal="true"
                  resizable="false"
                  closeOnEscape="true">

            <!-- Messages Novo Aluno -->
            <p:messages id="novoAlunoMessages" />

            <p:outputPanel rendered="#{not empty gestaoAlunoBean.aluno}">
            <!-- Panel Grid - Novo Aluno -->
                <p:panelGrid id="panelGridNovoAluno" columns="3">

                    <!-- ID - Novo Aluno -->
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    <h:outputText value="ID: " for="idNovoAluno"/>
                    <p:inputText id="idNovoAluno" value="#{gestaoAlunoBean.aluno.id}" required="true"/>

                    <!-- Nome - Novo Aluno -->
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    <h:outputText value="Nome: " for="nomeNovoAluno"/>
                    <p:inputText id="nomeNovoAluno" value="#{gestaoAlunoBean.aluno.nomeAluno}" required="true"/>

                    <!-- CPF - Novo Aluno -->
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    <h:outputText value="CPF: " for="cpfNovoAluno"/>
                    <p:inputMask id="cpfNovoAluno"
                                 mask = "999.999.999-99"
                                 size="11"
                                 maxlength="11"
                                 value="#{gestaoAlunoBean.aluno.cpf}"
                                 required="true"/>

                    <!-- Data de Nascimento - Novo Aluno -->
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    <h:outputText value="Data de Nascimento: " for="dataNovoAluno"/>
                    <p:calendar id="dataNovoAluno"
                                pattern="dd/MM/yyyy"
                                size="30"
                                value="#{gestaoAlunoBean.aluno.dataNascimento}"
                                required="true"/>

                    <!-- Curso - Novo Aluno -->
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                    <h:outputText value="Curso: " for="cursoNovoAluno"/>
                    <p:selectOneMenu id="cursoNovoAluno" value="#{gestaoAlunoBean.aluno.curso}" required="true">
                        <f:selectItem itemLabel="Selecione..." itemValue="#{null}"/>
                        <f:selectItems value="#{gestaoAlunoBean.tiposCurso()}"
                                       var="tipoCurso"
                                       itemLabel="#{tipoCurso.descricao}"
                                       itemValue="#{tipoCurso}"/>
                    </p:selectOneMenu>

                    <!-- Botao Salvar - Novo Aluno -->
                    <h:outputText />
                    <p:commandButton id="salvarNovoAlunoBotao"
                                     value="Salvar"
                                     icon="fa fa-check"
                                     action="#{gestaoAlunoBean.salvarAluno}"
                                     oncomplete="if (!args.validationFailed)
                                                    PF('novoAlunoDialogWidgetVar').hide();
                                                else
                                                    PF('novoAlunoDialogWidgetVar').show();"
                                     process="novoAlunoDialog"
                                     update="novoAlunoMessages alunosDataTable">
                        <p:resetInput target="novoAlunoDialog" />
                    </p:commandButton>
                </p:panelGrid>
            </p:outputPanel>

        </p:dialog>

        <!-- Datatable -->
        <p:dataTable id="alunosDataTable"
                     value="#{gestaoAlunoBean.listaAlunos}"
                     var="aluno"
                     emptyMessage="Nenhuma informação a ser exibida"
                     paginator="true"
                     rows="10"
                     paginatorPosition="bottom"
                     selectionMode="single"
                     selection="#{gestaoAlunoBean.aluno}"
                     rowKey="#{aluno.id}">

            <p:ajax event="rowSelect" update="formTop:toolbar formTop:novoAlunoDialog" />
            <p:ajax event="rowUnselect" update="formTop:toolbar" />

            <!-- ID - Datatable -->
            <p:column headerText="ID">
                <h:outputText value="#{aluno.id}" />
            </p:column>

            <!-- Nome - Datatable -->
            <p:column headerText="Nome">
                <h:outputText value="#{aluno.nomeAluno}" />
            </p:column>

            <!-- CPF - Datatable -->
            <p:column headerText="Cpf">
                <h:outputText value="#{aluno.cpf}" />
            </p:column>

            <!-- Data de Nascimento - Datatable -->
            <p:column headerText="Data Nascimento">
                <h:outputText value="#{aluno.dataNascimento}">
                    <f:convertDateTime pattern="dd/MM/yyyy" />
                </h:outputText>
            </p:column>

            <!-- Curso - Datatable -->
            <p:column headerText="Curso">
                <h:outputText value="#{aluno.curso.descricao}" />
            </p:column>
        </p:dataTable>
    </h:form>

        <p:spacer height="20" />

    <!-- FORM BOTTOM -->
    <h:form id="formBottom">

        <!-- 1. Criar um campo de texto, mais um de data, com um botão e realizar a validação dos campos -->
        <!-- 2. Criar um popup ou modal com a mensagem de erro -->
        <!-- Criar um popup com um campo digitável e retornar este campo na tela principal -->
        <p:panel id="panelValidacao" header="Validar o Nome e Data de Nascimento">
            <p:messages id="messagePanel" />

            <!-- Dialog Validacao -->
            <p:dialog icon="pi pi-user"
                      header="Validação de Aluno"
                      widgetVar="dialogValidacaoAluno"
                      closable="true"
                      closeOnEscape="true" modal="true"
                      resizable="false">
                <h:outputText value="#{gestaoAlunoBean.modalString}" />
            </p:dialog>

            <!-- Panel Grid Validacao -->
            <p:panelGrid id="panelGridValidacao" columns="2">
                <h:outputText value="Nome: " for="nome"/>
                <p:inputText id="nome"
                             value="#{gestaoAlunoBean.alunoValidacao.nomeAluno}"
                             required="true"
                             label="Nome" />

                <h:outputText value="Data de Nascimento: " for="data"/>
                <p:datePicker id="data"
                              value="#{gestaoAlunoBean.alunoValidacao.dataNascimento}"
                              required="true"
                              label="Data de Nascimento"
                              pattern="dd/MM/yyyy"/>

                <h:outputText />
                <p:commandButton value="Validar"
                                 icon="fa fa-check"
                                 action="#{gestaoAlunoBean.validarAluno}"
                                 oncomplete="if (args.validar) PF('dialogValidacaoAluno').show();"
                                 update="panelValidacao"
                                 process="@form"/>
            </p:panelGrid>
        </p:panel>
    </h:form>
</ui:define>

</ui:composition>
