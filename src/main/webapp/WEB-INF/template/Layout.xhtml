<!DOCTYPE html>
<!--suppress ALL -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head charset="UTF-8">
        <title>TCS Treinamento JSF</title>
    </h:head>

    <h:body>
        <h2>
                <ui:insert name="titulo" />
        </h2>

        <div id="conteudo">
            <ui:insert name="conteudo" />
        </div>

    </h:body>

    <footer>
        Copyright TCS Treinamento JSF
    </footer>

    <h:form>
        <p:confirmDialog global="true">
            <p:commandButton value="Sim" icon="fa fa-check" styleClass="ui-confirmdialog-yes" />
            <p:commandButton value="Não" icon="fa fa-remove" styleClass="ui-confirmdialog-no"/>
        </p:confirmDialog>
    </h:form>
</ui:composition>
